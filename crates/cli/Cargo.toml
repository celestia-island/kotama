[package]
name = "kotama-cli"
description = "Command-line surface for kotama: static dissection, live sessions, hook packaging."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license-file.workspace = true
publish.workspace = true

[[bin]]
name = "kotama"
path = "src/main.rs"

[features]
default = []
resource-swf = ["kotama-resource/swf"]
resource-vbs = ["kotama-resource/vbs"]
resource-dos-com = ["kotama-resource/dos-com"]
resource-dds = ["kotama-resource/dds"]
resource-tga = ["kotama-resource/tga"]

[dependencies]
kotama.workspace = true
kotama-image.workspace = true
kotama-scan.workspace = true
kotama-decomp.workspace = true
kotama-backend-ghidra.workspace = true
kotama-host.workspace = true
kotama-pack.workspace = true
kotama-proxy.workspace = true
kotama-resource.workspace = true
kotama-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
flate2 = { version = "^1", default-features = false, features = ["rust_backend"] }

[lints]
workspace = true
