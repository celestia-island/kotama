name: CI

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # 夹具缺失必须是红灯；不能把静态矩阵全跳过当成通过。
  KOTAMA_REQUIRE_FIXTURES: "1"

jobs:
  check:
    runs-on: [self-hosted, linux, x64, local]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the static fixture matrix
        run: python3 tools/build_fixtures.py
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p kotama-resource --all-targets --all-features -- -D warnings
      - run: cargo clippy -p kotama-cli --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      - run: cargo test -p kotama-resource --all-features
      - run: cargo test -p kotama-cli --all-features

  licenses:
    runs-on: [self-hosted, linux, x64, local]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny --version
      - run: cargo deny check licenses bans sources